# ─── Dinleyici ────────────────────────────────────────────────
# Mosquitto 2.x varsayılan olarak SADECE 127.0.0.1'i dinler.
# Konteyner içinde bu, dışarıdan hiçbir bağlantı kabul edilmemesi demektir.
listener 1883 0.0.0.0

# ─── Kimlik doğrulama ─────────────────────────────────────────
# Mosquitto 2.x varsayılan olarak anonim bağlantıyı REDDEDER.
# Yerel geliştirme/demo için açıyoruz — üretim için uygun DEĞİL.
allow_anonymous true

# ─── Kalıcılık ────────────────────────────────────────────────
# Telemetri anlık veridir; broker yeniden başlarsa kaybolması sorun değil.
persistence false

# ─── Loglama ──────────────────────────────────────────────────
# stdout'a yaz: "docker compose logs" ile görebilmek için
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# ─── Kuyruk sınırları ─────────────────────────────────────────
# Yavaş bir abone yüzünden broker'ın belleğinin şişmesini engeller
max_queued_messages 1000
max_inflight_messages 40